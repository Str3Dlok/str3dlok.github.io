<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" href="{{ '/assets/img/logo-icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#0a0b0d">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo-icon.png' | relative_url }}" alt="" width="28" height="28">
      <span>STR<b>3</b>DLOK <span class="full mono">/ tesis</span></span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.nav == 'inicio' %}class="active"{% endif %}>Inicio</a>
      <a href="{{ '/bitacora/' | relative_url }}" {% if page.nav == 'bitacora' or page.layout == 'post' %}class="active"{% endif %}>Bitácora</a>
      <a href="{{ '/contacto/' | relative_url }}" {% if page.nav == 'contacto' %}class="active"{% endif %}>Contacto</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <span class="mono">© {{ 'now' | date: '%Y' }} Alejandro Baeza · Str3Dlok</span>
    <span class="mono">Investigación doctoral · 2026 — 2030</span>
  </div>
</footer>
{% if page.script %}<script src="{{ page.script | relative_url }}" defer></script>{% endif %}
</body>
</html>
