# Configuración del sitio · Str3Dlok / Tesis
title: "Str3Dlok · Tesis doctoral"
description: "Gemelos digitales de patrimonio cultural: bitácora de investigación doctoral de Alejandro Baeza (Str3Dlok)."
author: "Alejandro Baeza"
lang: es
url: "https://str3dlok.github.io"
baseurl: ""
timezone: Europe/Madrid

# Enlaces de las entradas: /bitacora/AAAA/MM/DD/titulo/
permalink: /bitacora/:year/:month/:day/:title/

# Valores por defecto de cada entrada (ver _plantillas/entrada.md)
defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      author: "Alejandro Baeza"

markdown: kramdown
plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - _plantillas
