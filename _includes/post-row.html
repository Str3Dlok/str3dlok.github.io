{%- comment -%} Fila de la bitácora. Usa la variable de bucle "p". {%- endcomment -%}
<a class="post" href="{{ p.url | relative_url }}" data-tags="{{ p.tags | join: '|' }}">
  <div class="thumb cut">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="{{ p.image_alt | default: p.title | escape }}" width="168" height="126" loading="lazy" decoding="async">{% endif %}</div>
  <div class="post-info">
    <h3>{{ p.title }}</h3>
    <span class="sep"></span>
    <p>{{ p.description }}</p>
    <div class="tags">{% for t in p.tags limit:2 %}<span class="tag">#{{ t }}</span>{% endfor %}</div>
  </div>
  <time class="date mono" datetime="{{ p.date | date: '%Y-%m-%d' }}">{{ p.date | date: '%d/%m/%Y' }}</time>
</a>
